# PowerPredict TL on one server (Oracle Cloud Always Free, ARM, 2 OCPU / 12 GB):
# Kafka (KRaft) + MariaDB + FastAPI + Spark Streaming + meter bot + Streamlit + Caddy (HTTPS).
# Only Caddy is published to the internet (ports 80/443). Kafka, the database and FastAPI stay private.
#
#   docker compose --env-file server.env up -d --build
name: powerpredict

x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile }
  image: powerpredict-app
  restart: unless-stopped
  environment: &appenv
    TZ: Asia/Dili
    PP_DB_URL: mysql+pymysql://pp:${DB_PASSWORD}@db:3306/powerpredict_db?charset=utf8mb4
    PP_KAFKA_BOOTSTRAP: kafka:9092
    PP_KAFKA_TOPIC: smart-meter-readings
    PP_KAFKA_PARTITIONS: "3"
    PP_SPARK_MASTER: local[2]
    PP_SPARK_DRIVER_MEMORY: 3g
    PP_SPARK_SHUFFLE_PARTITIONS: "4"
    PP_DATA_DIR: /data
    PP_PUBLIC_GUEST: "1"
  volumes: [appdata:/data]

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xmx768m -Xms768m
      CLUSTER_ID: asyT0RY5QEW0xjXDr9qylg
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: Asia/Dili
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: powerpredict_db
      MARIADB_USER: pp
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: ["--innodb-buffer-pool-size=768M", "--max-connections=200", "--character-set-server=utf8mb4",
              "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./db_seed.sql.gz:/docker-entrypoint-initdb.d/10_seed.sql.gz:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 30

  api:
    <<: *app
    command: ["python", "-W", "ignore", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      kafka: { condition: service_healthy }
      db: { condition: service_healthy }

  stream:
    <<: *app
    command: ["python", "-W", "ignore", "-m", "pipeline.spark_streaming", "--engine", "spark", "--from-latest"]
    depends_on:
      kafka: { condition: service_healthy }
      db: { condition: service_healthy }
      api: { condition: service_started }

  bot:
    <<: *app
    command: ["python", "-W", "ignore", "-m", "bot.bot_live", "--api", "http://api:8000"]
    depends_on:
      api: { condition: service_started }

  dashboard:
    <<: *app
    command: ["python", "-W", "ignore", "-m", "streamlit", "run", "dashboard/app.py", "--server.port", "8505",
              "--server.address", "0.0.0.0", "--server.headless", "true"]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PP_DOMAIN: ${PP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [dashboard]

volumes:
  kafkadata:
  dbdata:
  appdata:
  caddy_data:
  caddy_config:
